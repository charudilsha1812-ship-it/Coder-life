<!DOCTYPE html>
<html>

<head>
    <title>My First Web Page</title>
</head>

<body>
    <div style="background-color:blue; text-align: center;">
        <h1>My Name is Khan</h1>
        <h2>This is a journey</h2>
        <p>I love that movie</p>
    </div>

    <div style="background-color:purple; text-align: center;">
        <h2>Our Products</h2>
        <!--Unordered List-->
        <ul>
            <li>Dresses</li>
            <li>Denims</li>
        </ul>
        <!--Ordered List-->
        <ol>
            <li>Frocks</li>
            <li>Trousers</li>
        </ol>
    </div>

    <div>
        <!--Hyperlink - Anchored Tag-->
        <a href="https://www.google.com">Google</a>
        <br>
        <!--Image Tag-->
        <img src="haha.webp" alt="Centered Image"
            style="display: block; margin-left: auto; margin-right: auto; width: 20%;">
    </div>

    <div>
        <table border="1">
            <tr>
                <th>Item Number</th>
                <th>Dress Name</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>001</td>
                <td>Levis Denim</td>
                <td>LKR 1000</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Cargo Pant</td>
                <td>LKR 2500</td>
                /tr>
        </table>
    </div>
</body>

</html>
